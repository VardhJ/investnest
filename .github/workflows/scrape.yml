name: Scrape SARFAESI Properties

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scraper
          python scraper.py
      - name: Commit updated data (if no Supabase)
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@investwise.in"
          git add data/properties.json || true
          git diff --staged --quiet || git commit -m "Update property data $(date +%Y-%m-%d)"
          git push || true